[mod-name]
autonomous-car=Voiture autonome

[mod-description]
autonomous-car=Ajoute une petite voiture autonome qui travaille là où aucun réseau de robots n'arrive : elle construit les fantômes que vous sélectionnez, remblaie l'eau, démonte ce qui est marqué pour la déconstruction et remplace ce qui est marqué pour la mise à niveau. Elle prend les objets dans des coffres d'approvisionnement, se recharge à ses chargeurs et se gare dans un garage quand elle n'a rien à faire.

[entity-name]
autonomous_car=Voiture autonome
autonomous_car_charger=Chargeur de voitures autonomes
autonomous_car_garage=Garage de voitures autonomes
autonomous_car_chest=Coffre d'approvisionnement des voitures autonomes
autonomous_car_turret=Mitrailleuse de voiture autonome
autonomous_car_delivery_chest=Coffre de livraison des voitures autonomes
autonomous_car_return_chest=Coffre de retour des voitures autonomes
autonomous_car_link=Liaison logique des voitures autonomes

[entity-description]
autonomous_car=Construit les fantômes (remblai compris), démonte les entités marquées pour la déconstruction et remplace celles marquées pour la mise à niveau, que vous sélectionnez avec le sélecteur des voitures autonomes, là où aucun réseau de robots n'arrive. Elle prend les objets dans des coffres d'approvisionnement, se recharge à un chargeur et se gare dans un garage quand elle n'a rien à faire. Coincée parmi des arbres ou des rochers, elle se dégage en les détruisant, sans rien en récupérer.
autonomous_car_charger=Recharge la batterie des voitures autonomes à partir du réseau électrique.
autonomous_car_garage=Range les voitures autonomes qui n'ont rien à faire, les répare lentement, et en fait sortir une quand il y a du travail.
autonomous_car_chest=Les voitures autonomes prennent dans ce coffre les objets de leurs chantiers, et y rapportent ce qu'elles n'ont pas utilisé ainsi que ce qu'elles ont démonté ou remplacé.
autonomous_car_delivery_chest=Un coffre d'approvisionnement qui demande au réseau logistique les objets qui manquent encore aux voitures autonomes, et que les robots logistiques livrent.
autonomous_car_return_chest=Un coffre d'approvisionnement où les voitures autonomes déposent en premier ce qu'elles n'ont pas utilisé, ainsi que ce qu'elles ont démonté ou remplacé. Les robots logistiques emportent tout.
autonomous_car_link=Met l'état d'un garage (voitures garées, places libres, santé, charge) ou d'un chargeur (charge, puissance, voitures) sur le réseau logique, avec les signaux des voitures autonomes.

[virtual-signal-name]
autonomous_car_signal_free_places=Places libres
autonomous_car_signal_health=Santé moyenne
autonomous_car_signal_charge=Charge moyenne
autonomous_car_signal_buffer=Charge du tampon
autonomous_car_signal_power=Puissance prélevée
autonomous_car_signal_users=Voitures utilisatrices

[virtual-signal-description]
autonomous_car_signal_free_places=Garage : places encore libres pour des voitures. Le nombre de voitures garées est le signal de l'objet voiture.
autonomous_car_signal_health=Garage : santé moyenne des voitures garées (%).
autonomous_car_signal_charge=Garage : charge moyenne des voitures garées (%).
autonomous_car_signal_buffer=Chargeur : charge de son tampon (%).
autonomous_car_signal_power=Chargeur : puissance prélevée sur le réseau électrique (kW).
autonomous_car_signal_users=Chargeur : voitures en charge ou en route vers lui.

[item-subgroup-name]
autonomous_car_signals=Voitures autonomes

[item-name]
autonomous_car_locked_slot=Emplacement verrouillé
autonomous_car_fuel=Charge de batterie de voiture autonome
autonomous_car_ghost_selector=Sélecteur des voitures autonomes

[item-description]
autonomous_car_locked_slot=Cet emplacement n'est pas encore disponible.
autonomous_car_ghost_selector=Faites glisser sur des fantômes pour les faire construire par les voitures autonomes, sur des entités marquées pour la déconstruction pour les faire démonter, ou sur des entités marquées pour la mise à niveau pour les faire remplacer. Ce qui se trouve dans un réseau de robots est laissé aux robots.

[fuel-category-name]
autonomous_car_fuel=Batterie de voiture autonome

[shortcut-name]
autonomous_car_ghost_selector_shortcut=Sélecteur des voitures autonomes
autonomous_car_missing_items_shortcut=Objets manquants des voitures autonomes
autonomous_car_debug_view_shortcut=Affichage de débogage des voitures autonomes

[shortcut-description]
autonomous_car_ghost_selector_shortcut=Donne le sélecteur des voitures autonomes.
autonomous_car_missing_items_shortcut=Affiche ou masque la liste des objets que les voitures autonomes attendent.
autonomous_car_debug_view_shortcut=Affiche ou masque la destination, le chemin, l'état et les coûts de braquage de la voiture autonome sous le curseur ou ouverte.

