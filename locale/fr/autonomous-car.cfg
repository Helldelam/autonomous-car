[technology-description]
autonomous_car_repair=Les garages réparent les voitures garées tant qu'ils contiennent des kits de réparation, qui s'usent.
autonomous_car=Débloque la voiture autonome, le chargeur, le garage et le coffre d'approvisionnement. Les voitures se défendent une fois Militaire recherché.
autonomous_car_cargo=Les voitures autonomes transportent __1__ emplacements (plus un pour les batteries).
autonomous_car_garage=Un garage accueille __1__ voitures.
autonomous_car_chargers=Un chargeur sert __1__ voitures à la fois ; son tampon grandit avec elles.
autonomous_car_charge_speed=Les voitures se chargent __1__ fois plus vite que sans recherche de vitesse de charge.
autonomous_car_build_speed=Les voitures construisent __1__ fois plus vite que sans recherche de vitesse de construction.

