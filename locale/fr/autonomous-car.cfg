[mod-name]
autonomous-car=Voiture autonome

[mod-description]
autonomous-car=Ajoute une petite voiture autonome qui construit les fantômes que vous sélectionnez là où aucun réseau de robots n'arrive. Elle prend les objets dans des coffres d'approvisionnement, se recharge à ses chargeurs et se gare dans un garage quand elle n'a rien à faire.

[entity-name]
autonomous_car=Voiture autonome
autonomous_car_charger=Chargeur de voitures autonomes
autonomous_car_garage=Garage de voitures autonomes
autonomous_car_chest=Coffre d'approvisionnement des voitures autonomes

[entity-description]
autonomous_car=Construit les fantômes, démonte les entités marquées pour destruction et remplace celles marquées pour mise à niveau, que vous sélectionnez avec le sélecteur de fantômes, là où aucun réseau de robots n'arrive. Elle prend les objets dans des coffres d'approvisionnement, se recharge à un chargeur et se gare dans un garage quand elle n'a rien à faire.
autonomous_car_charger=Recharge la batterie des voitures autonomes à partir du réseau électrique.
autonomous_car_garage=Range les voitures autonomes qui n'ont rien à faire, et en fait sortir une quand des fantômes sont à construire.
autonomous_car_chest=Les voitures autonomes prennent dans ce coffre les objets de leurs constructions, et y rapportent ce qu'elles n'ont pas utilisé.

[item-name]
autonomous_car_fuel=Charge de batterie de voiture autonome
autonomous_car_ghost_selector=Sélecteur de fantômes pour voitures autonomes

[item-description]
autonomous_car_ghost_selector=Faites glisser sur des fantômes pour les faire construire par les voitures autonomes, sur des entités marquées pour destruction pour les faire démonter, ou sur des entités marquées pour mise à niveau pour les faire remplacer. Ce qui se trouve dans un réseau de robots est laissé aux robots.

[fuel-category-name]
autonomous_car_fuel=Batterie de voiture autonome

[shortcut-name]
autonomous_car_ghost_selector_shortcut=Sélecteur de fantômes pour voitures autonomes
autonomous_car_missing_items_shortcut=Objets manquants des voitures autonomes
autonomous_car_debug_view_shortcut=Affichage de débogage des voitures autonomes

[shortcut-description]
autonomous_car_missing_items_shortcut=Affiche ou masque la liste des objets que les voitures autonomes attendent.
autonomous_car_debug_view_shortcut=Affiche ou masque la destination, le chemin et l'état de la voiture autonome sous le curseur ou ouverte.

[autonomous-car-gui]
title=Objets manquants
nothing-missing=Aucune voiture n'attend d'objet.
item=Objet
count=Manquant
cars=Voitures

[controls]
autonomous_car_ghost_selector_input=Sélecteur de fantômes pour voitures autonomes
