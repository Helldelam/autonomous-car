; Messages affichés aux joueurs et alertes sur la carte (les libellés des fenêtres sont dans autonomous-car.cfg).
; Le jeu choisit le texte dans la langue de chaque joueur : les scripts envoient {"autonomous-car-messages.<clé>", ...}.
[autonomous-car-messages]
selection-busy=La sélection précédente est encore en cours de traitement. Attendez un instant avant de sélectionner de nouveau.
selection-empty=Aucun nouveau fantôme ni aucune entité marquée pour démontage ou mise à niveau, hors du réseau de robots, n'a été trouvé dans la sélection.
selection-clustering=Sélection de __1__ fantômes et entités marquées reçue : les lots sont en préparation.
selection-giving-out=__1__ lot(s) encore en cours de distribution aux voitures.
assigned-deconstruct=__1__ lot(s) de démontage attribué(s).
assigned-build=__1__ lot(s) de construction attribué(s).
assigned-upgrade=__1__ lot(s) de mise à niveau attribué(s).
assigned-network=__1__ lot(s) du réseau logistique attribué(s).
queued-waiting=__1__ lot(s) en file, en attente qu'une voiture se libère.
queued-no-car=__1__ lot(s) en file : aucune voiture autonome disponible, construisez-en une.
garage-no-room=Pas de place dans votre inventaire pour la voiture, ses batteries et ses munitions.
trace-off=Trace des voitures arrêtée (__1__ dans script-output).
trace-on=Trace des voitures lancée : __1__ dans script-output du dossier utilisateur de Factorio.
alert-no-charger=Une voiture autonome doit se recharger mais aucun chargeur n'est à sa portée.
alert-missing-item=Il manque l'objet « __1__ » à une voiture autonome pour terminer une construction ; elle attend un approvisionnement.
alert-missing-item-quality=Il manque l'objet « __1__ » de qualité __2__ à une voiture autonome pour terminer une construction ; elle attend un approvisionnement.
alert-supply-full=Les coffres d'approvisionnement sont pleins (ou il n'y en a pas) : une voiture autonome ne peut pas vider son coffre. Faites de la place dans un coffre.
alert-garage-full=Plus de place dans ce garage pour la voiture qui veut s'y garer.
alert-not-empty=Une voiture autonome transporte encore des objets et ne peut pas se garer tant que son coffre n'est pas vide.
alert-garage-exit-blocked=Pas de place pour qu'une voiture sorte de ce garage.
alert-no-garage=Aucun garage disponible pour qu'une voiture autonome s'y gare.
alert-flee=Une voiture autonome fuit un ennemi.
alert-unreachable=Une voiture autonome ne trouve pas de moyen de se recharger assez pour atteindre sa destination.
alert-stuck=Une voiture autonome est bloquée. Elle réessaiera dans quelques secondes si vous ne la dégagez pas.
alert-stuck-final=Une voiture autonome est définitivement bloquée. Elle va bientôt abandonner sa tâche : dégagez-la ou vérifiez les environs.
alert-battery-empty=Une voiture autonome n'a plus de batterie et ne peut plus bouger : mettez une batterie dans l'emplacement des batteries (dernier slot de son coffre), ou récupérez-la.
alert-build-failed=Une voiture autonome n'a pas pu construire, démonter ou remplacer une entité après __1__ essais et y a renoncé ; elle a été remise dans la file générale.
alert-abandoned-shore=Une voiture autonome ne peut pas atteindre l'eau à remblayer : aucun fantôme de remblai de son lot n'est à côté d'une terre. Lot abandonné ; sélectionnez de nouveau les fantômes quand la rive sera accessible.
alert-abandoned-stuck=Une voiture autonome a ABANDONNÉ sa tâche car elle est restée bloquée : sélectionnez de nouveau les fantômes si le passage est dégagé.
alert-abandoned-danger=Une voiture autonome a ABANDONNÉ sa tâche : des ennemis reviennent près de son chantier. Sélectionnez de nouveau les fantômes quand la zone sera sûre.
alert-abandoned-unreachable=Une voiture autonome a ABANDONNÉ sa tâche en cours après de longs échecs : vérifiez les obstacles ou l'absence de chargeurs.
command-car-trace=Écrit une trace des voitures autonomes dans script-output (voir game_trace.lua). Argument facultatif : le numéro d'unité d'une voiture. Relancer la commande l'arrête.
