; Messages printed to the players and map alerts (the labels of the windows are in autonomous-car.cfg).
; The game picks the text of each player's language: scripts send {"autonomous-car-messages.<key>", ...}.
[autonomous-car-messages]
selection-busy=The previous selection is still being processed. Wait a moment before selecting again.
selection-empty=No new ghost or entity marked for deconstruction or upgrade outside the robot network found in the selection.
selection-clustering=Selection of __1__ ghosts and marked entities received: the batches are being prepared.
selection-giving-out=__1__ batch(es) still being given out to the cars.
assigned-deconstruct=__1__ destruction batch(es) assigned.
assigned-build=__1__ construction batch(es) assigned.
assigned-upgrade=__1__ upgrade batch(es) assigned.
assigned-network=__1__ logistic network batch(es) assigned.
queued-waiting=__1__ batch(es) queued, waiting for a car to become available.
queued-no-car=__1__ batch(es) queued: no autonomous car available at all, build one.
garage-no-room=No room in your inventory for the car, its batteries and its ammo.
trace-off=Car trace off (__1__ in script-output).
trace-on=Car trace on: __1__ in script-output of the Factorio user folder.
alert-no-charger=An autonomous car needs to recharge but no reachable charger is available.
alert-missing-item=An autonomous car is missing item '__1__' to complete a construction, waiting for supply.
alert-missing-item-quality=An autonomous car is missing item '__1__' of quality __2__ to complete a construction, waiting for supply.
alert-supply-full=The supply chests are full (or there is none): an autonomous car cannot empty its trunk. Make room in a chest.
alert-garage-full=No room left in this garage for the car trying to park.
alert-not-empty=An autonomous car still carries items and cannot park until its trunk is empty.
alert-garage-exit-blocked=No room for a car to leave this garage.
alert-no-garage=No available garage found for an autonomous car to park in.
alert-flee=An autonomous car is fleeing from an enemy.
alert-unreachable=An autonomous car cannot find a way to recharge enough to reach its destination.
alert-stuck=An autonomous car is stuck. It will try again in a few seconds unless you free it.
alert-stuck-final=An autonomous car is stuck for good. It will abandon its task soon: free it or check the area.
alert-battery-empty=An autonomous car has run out of battery and cannot move: put a battery in the battery slot (last slot of its trunk), or recover it.
alert-build-failed=An autonomous car could not build, mine or replace an entity after __1__ attempts and gave up on it; it has been put back in the general queue.
alert-abandoned-shore=An autonomous car cannot reach the water to fill in: no landfill ghost of its batch is next to land. Batch abandoned; select the ghosts again once the shore is reachable.
alert-abandoned-stuck=An autonomous car ABANDONED its task because it stayed stuck: select the ghosts again if the way is clear now.
alert-abandoned-danger=An autonomous car ABANDONED its task: enemies keep coming near its site. Select the ghosts again once the area is safe.
alert-abandoned-unreachable=An autonomous car has ABANDONED its current task after failing for a long time - check the area for obstructions or missing chargers.
command-car-trace=Writes a trace of the autonomous cars to script-output (see game_trace.lua). Optional argument: the unit number of one car. Run it again to stop.
