[mod-name]
autonomous-car=Autonomous Car

[mod-description]
autonomous-car=Adds a small autonomous car that works where no robot network reaches: it builds the ghosts you select, fills in water with landfill, mines what is marked for deconstruction and replaces what is marked for upgrade. It takes the items from supply chests, recharges at its chargers and parks in a garage when it has nothing to do.

