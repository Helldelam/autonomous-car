[mod-name]
autonomous-car=Autonomous Car

[mod-description]
autonomous-car=Cars that build where your robots do not reach. Drag the autonomous car selector (Alt+G) over ghosts and marked entities: the cars fetch the items from supply chests, build, deconstruct, upgrade or landfill, then recharge and park on their own. Not tested with Space Age yet. Developed with extensive use of AI.

[entity-name]
autonomous_car=Autonomous car
autonomous_car_charger=Autonomous car charger
autonomous_car_garage=Autonomous car garage
autonomous_car_chest=Autonomous car supply chest
autonomous_car_turret=Autonomous car gun
autonomous_car_delivery_chest=Autonomous car delivery chest
autonomous_car_return_chest=Autonomous car return chest
autonomous_car_link=Autonomous car circuit link

[entity-description]
autonomous_car=Builds the ghosts (landfill included), mines the entities marked for deconstruction and replaces those marked for upgrade, that you select with the autonomous car selector where no robot network reaches. It takes the items from supply chests, recharges at a charger and parks in a garage when it has nothing to do. Stuck among trees or rocks, it clears its way by destroying them, without collecting anything from them.
autonomous_car_charger=Recharges the battery of autonomous cars from the electric network.
autonomous_car_garage=Stores the autonomous cars that have nothing to do, slowly repairs them, and sends one out when there is work.
autonomous_car_chest=Autonomous cars take the items for their work from this chest, and bring back what they did not use, along with what they mined or replaced.
autonomous_car_delivery_chest=A supply chest that requests from the logistic network the items the autonomous cars still lack, which the logistic robots deliver.
autonomous_car_return_chest=A supply chest where the autonomous cars deposit first what they did not use, along with what they mined or replaced. The logistic robots take everything away.
autonomous_car_link=Puts the state of a garage (parked cars, free places, health, charge) or of a charger (charge, power, cars) on the circuit network, with the autonomous car signals.

[virtual-signal-name]
autonomous_car_signal_free_places=Free places
autonomous_car_signal_health=Average health
autonomous_car_signal_charge=Average charge
autonomous_car_signal_buffer=Buffer charge
autonomous_car_signal_power=Power drawn
autonomous_car_signal_users=Cars using

[virtual-signal-description]
autonomous_car_signal_free_places=Garage: places still free for cars. The number of parked cars is the car item signal.
autonomous_car_signal_health=Garage: average health of the parked cars (%).
autonomous_car_signal_charge=Garage: average charge of the parked cars (%).
autonomous_car_signal_buffer=Charger: charge of its buffer (%).
autonomous_car_signal_power=Charger: power drawn from the electric network (kW).
autonomous_car_signal_users=Charger: cars charging or on their way to it.

[item-subgroup-name]
autonomous_car_signals=Autonomous cars

[item-name]
autonomous_car_locked_slot=Locked slot
autonomous_car_fuel=Autonomous car battery charge
autonomous_car_ghost_selector=Autonomous car selector

[item-description]
autonomous_car_locked_slot=This slot is not available yet.
autonomous_car_ghost_selector=Drag over ghosts to have autonomous cars build them, over entities marked for deconstruction to have them mined, or over entities marked for upgrade to have them replaced. Anything inside a robot network is left to the robots.

