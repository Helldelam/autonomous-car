[item-description]
autonomous_car_locked_slot=This slot is not available yet.
autonomous_car_ghost_selector=Drag over ghosts to have autonomous cars build them, over entities marked for deconstruction to have them mined, or over entities marked for upgrade to have them replaced. Anything inside a robot network is left to the robots.

