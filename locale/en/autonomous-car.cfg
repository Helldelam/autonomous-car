[mod-name]
autonomous-car=Autonomous Car

[mod-description]
autonomous-car=Adds a small autonomous car that builds the ghosts you select where no robot network reaches. It takes the items from supply chests, recharges at its chargers and parks in a garage when it has nothing to do.

[entity-name]
autonomous_car=Autonomous car
autonomous_car_charger=Autonomous car charger
autonomous_car_garage=Autonomous car garage
autonomous_car_chest=Autonomous car supply chest

[entity-description]
autonomous_car=Builds the ghosts, and mines the entities marked for deconstruction, that you select with the ghost selector where no robot network reaches. It takes the items from supply chests, recharges at a charger and parks in a garage when it has nothing to do.
autonomous_car_charger=Recharges the battery of autonomous cars from the electric network.
autonomous_car_garage=Stores the autonomous cars that have nothing to do, and sends one out when ghosts need building.
autonomous_car_chest=Autonomous cars take the items for their constructions from this chest, and bring back what they did not use.

[item-name]
autonomous_car_fuel=Autonomous car battery charge
autonomous_car_ghost_selector=Autonomous car ghost selector

[item-description]
autonomous_car_ghost_selector=Drag over ghosts to have autonomous cars build them, or over entities marked for deconstruction to have them mined. Anything inside a robot network is left to the robots.

[fuel-category-name]
autonomous_car_fuel=Autonomous car battery

