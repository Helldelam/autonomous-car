autonomous_car=Autonomous car
autonomous_car_charger=Autonomous car charger
autonomous_car_garage=Autonomous car garage
autonomous_car_chest=Autonomous car supply chest
autonomous_car_turret=Autonomous car gun
autonomous_car_delivery_chest=Autonomous car delivery chest
autonomous_car_return_chest=Autonomous car return chest
autonomous_car_link=Autonomous car circuit link

[entity-description]
autonomous_car=Builds the ghosts (landfill included), mines the entities marked for deconstruction and replaces those marked for upgrade, that you select with the autonomous car selector where no robot network reaches. It takes the items from supply chests, recharges at a charger and parks in a garage when it has nothing to do. Stuck among trees or rocks, it clears its way by destroying them, without collecting anything from them.
autonomous_car_charger=Recharges the battery of autonomous cars from the electric network.
autonomous_car_garage=Stores the autonomous cars that have nothing to do, slowly repairs them, and sends one out when there is work.
autonomous_car_chest=Autonomous cars take the items for their work from this chest, and bring back what they did not use, along with what they mined or replaced.
autonomous_car_delivery_chest=A supply chest that requests from the logistic network the items the autonomous cars still lack, which the logistic robots deliver.
autonomous_car_return_chest=A supply chest where the autonomous cars deposit first what they did not use, along with what they mined or replaced. The logistic robots take everything away.
autonomous_car_link=Garage:\n- Car item: parked cars\n- F: free places\n- H: average health (%)\n- C: average charge (%)\nCharger:\n- C: buffer charge (%)\n- W: power drawn from the electric network (kW)\n- U: cars using it

[item-name]
autonomous_car_locked_slot=Locked slot
autonomous_car_fuel=Autonomous car battery charge
