[entity-description]
autonomous_car=Builds the ghosts you select with the ghost selector where no robot network reaches. It takes the items from supply chests, recharges at a charger and parks in a garage when it has nothing to do.
autonomous_car_charger=Recharges the battery of autonomous cars from the electric network.
autonomous_car_garage=Stores the autonomous cars that have nothing to do, and sends one out when ghosts need building.
autonomous_car_chest=Autonomous cars take the items for their constructions from this chest, and bring back what they did not use.

