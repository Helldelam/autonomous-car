autonomous_car=Unlocks the autonomous car, the charger, the garage and the supply chest. Cars defend themselves once Military is researched.
autonomous_car_cargo=Autonomous cars carry __1__ slots of cargo (plus one for batteries).
autonomous_car_garage=A garage holds __1__ cars.
autonomous_car_chargers=A charger serves __1__ cars at once; its buffer grows with them.
autonomous_car_charge_speed=Cars charge __1__ times as fast as without any charge speed research.
autonomous_car_build_speed=Cars build __1__ times as fast as without any build speed research.

